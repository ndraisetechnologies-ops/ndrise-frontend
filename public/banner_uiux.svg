<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="50%" stop-color="#4a1259" />
      <stop offset="100%" stop-color="#641e73" />
    </linearGradient>

    <!-- Card Glow -->
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Figma Colors -->
    <linearGradient id="figma-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f24e1e" />
      <stop offset="100%" stop-color="#ff7262" />
    </linearGradient>
    <linearGradient id="figma-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a259ff" />
      <stop offset="100%" stop-color="#1abcfe" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-grad)"/>

  <!-- Geometric Grid & Wireframe Circles -->
  <circle cx="700" cy="80" r="180" fill="url(#pink-glow)" opacity="0.3" filter="blur(30px)"/>
  <circle cx="100" cy="320" r="140" fill="#3b82f6" opacity="0.2" filter="blur(40px)"/>

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Figma Style Mobile Screen Mockup 1 -->
  <g filter="url(#shadow)" transform="translate(180, 50)">
    <rect width="180" height="320" rx="20" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <!-- Screen Header -->
    <rect x="20" y="25" width="80" height="12" rx="4" fill="#ec4899"/>
    <circle cx="150" cy="31" r="8" fill="#38bdf8"/>

    <!-- Hero Card -->
    <rect x="15" y="55" width="150" height="85" rx="12" fill="url(#pink-glow)"/>
    <rect x="25" y="110" width="70" height="8" rx="3" fill="#ffffff"/>

    <!-- Lists -->
    <rect x="15" y="155" width="150" height="40" rx="8" fill="#1e293b"/>
    <circle cx="32" cy="175" r="10" fill="#a855f7"/>
    <rect x="50" y="170" width="80" height="10" rx="3" fill="#94a3b8"/>

    <rect x="15" y="205" width="150" height="40" rx="8" fill="#1e293b"/>
    <circle cx="32" cy="225" r="10" fill="#34d399"/>
    <rect x="50" y="220" width="80" height="10" rx="3" fill="#94a3b8"/>

    <!-- Bottom Nav -->
    <rect x="35" y="280" width="110" height="20" rx="10" fill="#334155"/>
  </g>

  <!-- Figma Style Mobile Screen Mockup 2 (Overlapping) -->
  <g filter="url(#shadow)" transform="translate(420, 70)">
    <rect width="200" height="290" rx="20" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="20" y="25" width="100" height="14" rx="4" fill="#a855f7"/>

    <!-- Color Swatches Row -->
    <circle cx="30" cy="65" r="12" fill="#ec4899"/>
    <circle cx="65" cy="65" r="12" fill="#a855f7"/>
    <circle cx="100" cy="65" r="12" fill="#3b82f6"/>
    <circle cx="135" cy="65" r="12" fill="#10b981"/>

    <!-- Prototype Box -->
    <rect x="20" y="95" width="160" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <text x="50" y="155" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Figma Prototype</text>

    <!-- Action Button -->
    <rect x="20" y="225" width="160" height="40" rx="20" fill="url(#figma-purple)"/>
    <text x="65" y="250" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Explore UI</text>
  </g>

  <!-- Prototype Connection Arrow Line -->
  <path d="M 360 180 C 390 140, 400 140, 420 150" stroke="#ec4899" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
  <circle cx="360" cy="180" r="5" fill="#ec4899"/>
  <polygon points="420,150 410,143 412,155" fill="#ec4899"/>

  <!-- Floating Figma Logo Badge -->
  <g filter="url(#shadow)" transform="translate(640, 140)">
    <rect width="90" height="90" rx="20" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.2"/>
    <!-- Figma Icon -->
    <circle cx="35" cy="30" r="10" fill="#f24e1e"/>
    <circle cx="55" cy="30" r="10" fill="#ff7262"/>
    <circle cx="35" cy="50" r="10" fill="#a259ff"/>
    <circle cx="55" cy="50" r="10" fill="#1abcfe"/>
    <path d="M 25 70 A 10 10 0 0 0 45 70 L 45 60 L 25 60 Z" fill="#0acf83"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(40, 40)">
    <rect width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="20" y="23" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">DESIGN • UI/UX DESIGN</text>
  </g>
</svg>
